# Werken-mapu — Umbrales agronómicos por cultivo
# Fuente: literatura agronómica chilena (INIA, ODEPA) + consulta expertos locales.
# Formato: cada cultivo define temp_min (°C), lluvia_max_24h (mm), viento_max (km/h),
#          precip_hora_max (mm/h proxy granizo), y umbrales para recomendaciones.
# ------------------------------------------------------------------------------
# Para modificar umbrales sin redeploy:
#   1. Editar este archivo
#   2. Si usás GitHub: commit + push → Vercel redeploya automáticamente
#   3. Si usás servidor: recargar la app (uvicorn --reload o systemctl restart)
# ------------------------------------------------------------------------------

