# nginx.conf — Werken-mapu frontend (nginx:alpine)

gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml
  font/woff2;
gzip_proxied any;
gzip_vary on;

# Cache por tipo de contenido
map $sent_http_content_type $expires {
  default                          off;
  text/html                        1h;
  text/css                        30d;
  text/javascript                 30d;
  application/javascript          30d;
  image/svg+xml                   30d;
  image/png                       30d;
  image/webp                      30d;
  image/avif                      30d;
  font/woff2                      30d;
}

server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Seguridad basica
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # Cache headers segun content-type
  expires $expires;

  # HTML — cache corto, siempre revalidar
  location ~ \.html$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }

  # SPA fallback: app.html para /app
  location /app {
    try_files $uri /app.html;
  }

  # SPA fallback: index.html para el resto (excepto /api/)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy a backend
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts para que IAs no abandonen
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # Buffering para respuestas grandes (/historico, /clima)
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 32k;
  }

  # Denegar archivos ocultos
  location ~ /\. {
    deny all;
  }
}
